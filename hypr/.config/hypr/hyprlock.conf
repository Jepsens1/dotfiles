source = ~/.config/hypr/custom/colors.conf

$input_font = SF Pro Text
$clock_font = SF Pro Display Light
$date_font = SF Pro Display Regular
$name_font = SF Pro Display Medium

general {
    hide_cursor = true
    grace = 3
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 3, linear
    animation = fadeOut, 1, 3, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor = HDMI-A-2
    path = ~/.cache/theme/current-wallpaper
}

input-field {
    monitor = HDMI-A-2
    size = 13%, 5%
    outline_thickness = 3
    inner_color = $background_dark
    outer_color = $accent
    check_color = $magenta
    fail_color = $red
    font_color = $foreground
    fade_on_empty = false
    rounding = 60
    font_family = $input_font
    placeholder_text = Input password...
    fail_text = $PAMFAIL$FPRINTFAIL
    dots_spacing = 0.2
    position = 0, 140
    halign = center
    valign = bottom
}

# AVATAR
image {
    monitor = HDMI-A-2
    size = 120
    rounding = -1
    path = ~/.face.icon
    border_size = 4
    border_color = rgba(255, 255, 255, 0.6)
    position = 0, 360
    halign = center
    valign = bottom
}
# NAME
label {
    monitor = HDMI-A-2
    text = $USER
    font_family = $name_font
    font_size = 28
    position = 0, 290
    halign = center
    valign = bottom
    color = $foreground
}

# TIME
label {
    monitor = HDMI-A-2
    text = cmd[update:1000] date +"%H.%M"
    font_size = 180
    font_family = $clock_font
    position = 0, -240
    halign = center
    valign = top
}

# DATE
label {
    monitor = HDMI-A-2
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 35
    font_family = $date_font
    position = 0, -210
    halign = center
    valign = top
}
