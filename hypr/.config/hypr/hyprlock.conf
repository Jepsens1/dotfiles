$font = Jetbrains Mono Nerd Font

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

input-field {
    monitor =
    size = 12%, 5%
    dots_spacing = 0.3
    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    inner_color = rgba(0, 0, 0, 0.0) # no fill
    check_color = rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    font_color = rgb(143, 143, 143)
    font_family = $font
    fade_on_empty = false
    placeholder_text = Enter Password
    position = 0, 120
    halign = center
    valign = bottom
}

# USER
label {
    monitor =
    text = $USER
    font_family = $font
    position = 0, 240
    halign = center
    valign = bottom
}

image {
    monitor =
    size = 100
    border_size = 0
    path = ~/profile.png
    rounding = -1 
    position = 0, 280
    halign = center
    valign = bottom
}
# TIME
label {
    monitor =
    text = $TIME
    font_size = 80
    font_family = $font
    position = 0, -160
    halign = center
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d. %B %Y"
    font_size = 30
    font_family = $font

    position = 0, -120
    halign = center
    valign = top
}

label {
    monitor =
    text = $LAYOUT[dk,en]
    font_size = 20
    onclick = hyprctl switchxkblayout all text
    font_family = $font
    position = 0, 40
    halign = center
    valign = bottom
}
