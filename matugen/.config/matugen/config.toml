[config.wallpaper]
command = "awww img --transition-type center --transition-fps 60 '{{ image }}'"
set = true

[templates.ghostty]
input_path = '~/.config/matugen/templates/ghostty'
output_path = '~/.config/ghostty/colors'
post_hook = 'pkill -SIGUSR2 ghostty'

[templates.waybar]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/waybar/colors/custom.css'
post_hook = 'pkill -SIGUSR2 waybar'

[templates.walker]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/walker/themes/custom/colors.css'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'
post_hook = '~/.config/matugen/post-hook-scripts/gtk-themes-reload.sh {{mode}}'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'
post_hook = '~/.config/matugen/post-hook-scripts/gtk-themes-reload.sh {{mode}}'

[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/custom.theme'
post_hook = 'pkill -USR2 btop || true'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland-colors.lua'
output_path = '~/.config/hypr/custom/colors.lua'
post_hook = "~/.config/matugen/post-hook-scripts/update-hyprlock-background.sh '{{ image }}'"

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprland-colors.conf'
output_path = '~/.config/hypr/custom/colors.conf'

[templates.pywalfox]
input_path = '~/.config/matugen/templates/pywalfox-colors.json'
output_path = '~/.cache/wal/colors.json'
post_hook = '"$HOME/.local/share/mise/shims/pywalfox" update'

[templates.swaync]
input_path = '~/.config/matugen/templates/colors.css'
output_path = "~/.config/swaync/colors/colors.css"
post_hook = "swaync-client -rs"
